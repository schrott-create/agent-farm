<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Farm 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#101a18;color:#f2f4e8;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}#game{position:fixed;inset:0}#hud{position:absolute;top:18px;left:18px;background:#17231fe8;border:1px solid #59715d;padding:16px;border-radius:16px;max-width:310px;box-shadow:0 12px 36px #0006}h1{margin:0 0 5px;font-size:23px}small{color:#b6c6b3}#side{position:absolute;right:18px;top:18px;width:300px;background:#17231ff0;border:1px solid #59715d;border-radius:16px;padding:17px;box-shadow:0 12px 36px #0006}h2{margin:0 0 12px;font-size:19px}button,select,input{font:inherit}button{background:#e8ba66;color:#292417;border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#344b3f;color:white}button.danger{background:#a9524a;color:white}.agent{display:flex;align-items:center;gap:9px;padding:11px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}.agent.active{background:#344c3b;border-color:#9dc383}.agent .emoji{font-size:24px}.agent small{display:block;font-size:11px}.status{font-size:12px;color:#e8ba66}#controls{margin-top:12px;border-top:1px solid #526153;padding-top:14px}select,input{width:100%;background:#263a30;color:white;border:1px solid #627768;border-radius:8px;padding:9px;margin:8px 0}#actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#actions button{flex:1}.progress{height:9px;background:#33443a;border-radius:10px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#8cd16e;transition:width .25s}#log{font-size:12px;line-height:1.6;color:#c7d5c4;max-height:135px;overflow:auto}#bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#17231fe8;border:1px solid #59715d;border-radius:12px;padding:10px 16px;font-size:13px;white-space:nowrap}#err{position:absolute;left:20px;bottom:20px;background:#6d2d2d;padding:12px;display:none;max-width:450px}@media(max-width:700px){#hud{top:8px;left:8px;padding:10px;max-width:180px}h1{font-size:18px}#side{top:auto;bottom:58px;right:8px;width:min(310px,calc(100vw - 16px));max-height:65vh;overflow:auto;padding:12px}#bottom{font-size:11px;bottom:8px;padding:8px}#log{max-height:60px}}</style></head><body><div id="game"></div><div id="hud"><h1>🌻 Agent Farm 3D</h1><small>Dein gemütlicher KI-Bauernhof</small><p style="margin:10px 0 0;font-size:13px">🟢 Lokal · Keine API · Keine Claude-Tokens</p></div><aside id="side"><h2>👩‍🌾 Deine Agents</h2><div id="agents"></div><div id="controls"><b id="selected">Agent auswählen</b><div class="status" id="state">Bereit</div><select id="task"><option value="research">🌾 Heu sammeln – Recherche</option><option value="coding">🔨 Scheune bauen – Coding</option><option value="test">🐄 Kühe melken – Tests</option><option value="custom">✨ Eigene Aufgabe (Simulation)</option></select><input id="custom" placeholder="Deine Aufgabe..." style="display:none"><div class="progress"><div class="fill" id="bar"></div></div><div id="percent" style="font-size:12px">0 %</div><div id="actions"><button id="start">▶ Starten</button><button class="secondary" id="pause">⏸ Pause</button><button class="danger" id="cancel">✕ Stopp</button></div><h3 style="font-size:14px;margin-bottom:7px">📜 Ereignisse</h3><div id="log"></div></div></aside><div id="bottom">🖱️ Ziehen: Kamera drehen · Mausrad: Zoom · Agent anklicken: auswählen</div><div id="err"></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a6d8e7');scene.fog=new THREE.Fog('#a6d8e7',35,75);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(19,22,24);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('game').appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,0,0);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI/2.12;orbit.minDistance=12;orbit.maxDistance=49;orbit.update();scene.add(new THREE.HemisphereLight('#fff4d3','#6c8061',2.1));const sun=new THREE.DirectionalLight('#fff2c9',2.4);sun.position.set(-12,24,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.86});const green=mat('#86b867'),grass=mat('#8ebd70'),dirt=mat('#c9a574'),wood=mat('#9c6138'),darkwood=mat('#6d402b'),red=mat('#bb4e3b'),roof=mat('#713e37'),white=mat('#f4ead3'),stone=mat('#b7b3a3'),leaf=mat('#448b51');function box(w,h,d,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;group.add(o);return o}function ball(r,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),m);o.position.set(x,y,z);o.castShadow=true;group.add(o);return o}function cone(r,h,m,x,y,z,group=scene){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),m);o.position.set(x,y,z);o.rotation.y=Math.PI/4;o.castShadow=true;group.add(o);return o}box(36,.7,30,green,0,-.48,0);for(let i=0;i<90;i++){const x=(Math.random()-.5)*33,z=(Math.random()-.5)*27; if(Math.abs(x)<14&&Math.abs(z)<10)continue;ball(.09,mat(['#f3e29e','#eaa1b0','#f5eee0'][i%3]),x,.1,z)}
function path(x,z,w,d){box(w,.04,d,dirt,x,.02,z)}path(0,0,3,25);path(0,0,30,2.6);path(-7,-5,2,9);path(8,5,2,9);
function fence(x,z,w,d){for(let i=-w/2;i<=w/2+.1;i+=1.7){box(.17,.9,.17,wood,x+i,.48,z-d/2);box(.17,.9,.17,wood,x+i,.48,z+d/2)}for(let i=-d/2;i<=d/2+.1;i+=1.7){box(.17,.9,.17,wood,x-w/2,.48,z+i);box(.17,.9,.17,wood,x+w/2,.48,z+i)}for(const zz of [-d/2,d/2])for(const yy of [.35,.68])box(w,.11,.13,wood,x,yy,z+zz);for(const xx of [-w/2,w/2])for(const yy of [.35,.68])box(.13,.11,d,wood,x+xx,yy,z)}
function building(x,z,w,d,color,roofcolor){box(w,3,d,color,x,1.5,z);const a=box(w+.8,.25,d+.8,roofcolor,x,3.45,z);a.rotation.z=.12;box(1.15,1.9,.14,darkwood,x,.98,z+d/2+.08);box(.8,.8,.16,mat('#8ecde0'),x-w/3,2.05,z+d/2+.09);box(.8,.8,.16,mat('#8ecde0'),x+w/3,2.05,z+d/2+.09)}building(-9,-6,5.5,4.2,red,roof);building(9,-6,4.6,4.2,mat('#dfba83'),mat('#92613b'));building(-10,6,4.4,3.5,mat('#e3b97e'),mat('#8d5a37'));
// fields
for(let row=0;row<5;row++)for(let col=0;col<7;col++){const x=2+col*.8,z=4+row*.8;box(.62,.1,.62,mat('#805a38'),x,.05,z);cone(.21,.55,leaf,x,.42,z)}fence(4.5,5.8,7.5,5.6);
for(let i=0;i<9;i++){const x=-13+(i%3)*1.15,z=1+Math.floor(i/3)*1.1;box(.95,.55,.7,mat('#dbb55d'),x,.29,z);box(.95,.1,.7,mat('#efcf77'),x,.62,z)}fence(-11.7,2.2,5.8,5.5);
// cows
function cow(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(1.25,.8,.65,white,0,.95,0,g);box(.53,.55,.55,white,.75,1.04,0,g);for(const xx of [-.4,.4])for(const zz of [-.23,.23])box(.16,.65,.17,white,xx,.38,zz,g);box(.3,.28,.67,mat('#493d37'),-.12,1.36,0,g);ball(.09,mat('#2c2525'),1.03,1.12,-.17,g);ball(.09,mat('#2c2525'),1.03,1.12,.17,g);return g}cow(8.5,3);cow(11,4.7);fence(9.5,4,8,6);
for(let i=0;i<20;i++){const x=(Math.random()-.5)*34,z=(Math.random()-.5)*28;if(Math.abs(x)<14&&Math.abs(z)<10)continue;box(.36,1.6,.36,wood,x,.8,z);ball(1.05,leaf,x,2,z);ball(.85,leaf,x-.55,1.8,z+.2)}
// agents
const configs=[{name:'Heu-Agent',emoji:'🌾',color:'#e9b85f',home:[-11.5,1.8]},{name:'Bau-Agent',emoji:'🔨',color:'#72b7dd',home:[9,-5]},{name:'Melk-Agent',emoji:'🐄',color:'#dc91b9',home:[9,3.8]}];const agents=configs.map((cfg,i)=>{const g=new THREE.Group();scene.add(g);box(.62,.78,.42,mat(cfg.color),0,.82,0,g);ball(.32,mat('#f5cfa5'),0,1.47,0,g);const hat=box(.8,.12,.67,mat('#9b693e'),0,1.8,0,g);box(.43,.2,.44,mat('#c99b54'),0,1.95,0,g);for(const x of [-.2,.2])box(.18,.46,.19,mat('#4a5c64'),x,.24,0,g);for(const x of [-.43,.43])box(.16,.55,.17,mat('#f5cfa5'),x,.94,0,g);ball(.045,mat('#292929'),-.11,1.51,.29,g);ball(.045,mat('#292929'),.11,1.51,.29,g);g.position.set(-2+i*1.8,0,-1.5);g.userData.index=i;g.traverse(o=>{o.userData.agentIndex=i});return {...cfg,group:g,phase:'Bereit',progress:0,paused:false,task:'',target:null,elapsed:0}});let selected=0;const agentEl=document.getElementById('agents'),stateEl=document.getElementById('state'),bar=document.getElementById('bar'),pct=document.getElementById('percent'),taskSel=document.getElementById('task'),custom=document.getElementById('custom');function log(t){const e=document.createElement('div');e.textContent='• '+t;document.getElementById('log').prepend(e)}function renderUI(){agentEl.innerHTML='';agents.forEach((a,i)=>{const d=document.createElement('div');d.className='agent'+(i===selected?' active':'');d.innerHTML=`<span class="emoji">${a.emoji}</span><div><b>${a.name}</b><small>${a.phase}${a.task?' · '+a.task:''}</small></div>`;d.onclick=()=>{selected=i;renderUI()};agentEl.appendChild(d)});const a=agents[selected];document.getElementById('selected').textContent=a.name;stateEl.textContent=a.phase;bar.style.width=a.progress+'%';pct.textContent=Math.round(a.progress)+' %';document.getElementById('pause').textContent=a.paused?'▶ Weiter':'⏸ Pause'}taskSel.onchange=()=>custom.style.display=taskSel.value==='custom'?'block':'none';document.getElementById('start').onclick=()=>{const a=agents[selected];a.task=taskSel.value==='custom'?(custom.value.trim()||'Eigene Aufgabe'):{research:'Recherche',coding:'Coding',test:'Tests'}[taskSel.value];a.target=taskSel.value==='research'?[-11.5,1.8]:taskSel.value==='coding'?[9,-5]:taskSel.value==='test'?[9,3.8]:a.home;a.phase='Unterwegs';a.progress=0;a.paused=false;a.elapsed=0;log(a.name+' startet: '+a.task+' (Simulation)');renderUI()};document.getElementById('pause').onclick=()=>{const a=agents[selected];if(a.phase==='Bereit'||a.phase==='Fertig'||a.phase==='Abgebrochen')return;a.paused=!a.paused;log(a.name+(a.paused?' pausiert':' fortgesetzt'));renderUI()};document.getElementById('cancel').onclick=()=>{const a=agents[selected];a.phase='Abgebrochen';a.paused=false;a.target=null;log(a.name+' gestoppt');renderUI()};renderUI();log('Bauernhof bereit. Wähle einen Agenten und starte eine Aufgabe.');
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(agents.map(a=>a.group),true);if(hits.length){let o=hits[0].object;while(o&&o.userData.agentIndex===undefined)o=o.parent;if(o){selected=o.userData.agentIndex;renderUI()}}});
let prev=performance.now(),tick=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.07);prev=now;tick+=dt;agents.forEach((a,i)=>{if(a.paused)return;if(a.phase==='Unterwegs'&&a.target){const dx=a.target[0]-a.group.position.x,dz=a.target[1]-a.group.position.z,dist=Math.hypot(dx,dz);if(dist>.17){const step=Math.min(dist,dt*2);a.group.position.x+=dx/dist*step;a.group.position.z+=dz/dist*step;a.group.rotation.y=Math.atan2(dx,dz);a.group.position.y=Math.abs(Math.sin(tick*11+i))*0.07}else{a.group.position.y=0;a.phase='Arbeitet';log(a.name+' arbeitet an '+a.task);renderUI()}}else if(a.phase==='Arbeitet'){a.elapsed+=dt;a.progress=Math.min(100,a.elapsed/14*100);a.group.position.y=Math.abs(Math.sin(tick*8+i))*.065;if(a.progress>=100){a.phase='Fertig';a.group.position.y=0;log('✅ '+a.name+' fertig: '+a.task+' (simuliert)');renderUI()}}});if(Math.floor(tick*4)!==Math.floor((tick-dt)*4))renderUI();orbit.update();renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
